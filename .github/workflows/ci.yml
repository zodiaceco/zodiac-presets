name: Continuous integration checks

on: [push]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('bun.lock', 'bunfig.toml') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun check:format
      - name: Check types
        run: bun check:types
      - name: Check generated kit types are up to date
        run: bun codegen && git diff --exit-code src/kit.generated.d.ts
      - name: Build package
        run: bun run build

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('bun.lock', 'bunfig.toml') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
